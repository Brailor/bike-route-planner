# The routing engine on Fly.io (docs/deploy.md): private, reached only by the web app at its Flycast address.
# Deploy with pnpm fly:routing. The graph is on the volume, copied up from this computer (scripts/fly-volume.sh).
app = 'bike-route-planner-routing'
primary_region = 'fra'

[mounts]
  source = 'graph'
  destination = '/srv/routing/data/graph-cache'

[http_service]
  internal_port = 8989
  # Flycast is plain HTTP; TLS ends at the web app.
  force_https = false
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
